<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bảng clipboard trên macOS (bản xem trước)</title>
<style>
.board {
  --tint: rgba(255, 255, 255, 0.36);
  --edge: rgba(255, 255, 255, 0.7);
  --fill: rgba(60, 60, 67, 0.1);
  --hairline: rgba(60, 60, 67, 0.18);
  --ink: rgba(0, 0, 0, 0.88);
  --ink-2: rgba(60, 60, 67, 0.72);
  --ink-3: rgba(60, 60, 67, 0.5);
  --select: #0a6cff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  box-sizing: border-box;
  border: 1px solid var(--edge);
  border-radius: 14px;
  overflow: hidden;
  background: var(--tint);
  color: var(--ink);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

@media (prefers-color-scheme: dark) {
  .board {
    --tint: rgba(28, 28, 32, 0.38);
    --edge: rgba(255, 255, 255, 0.18);
    --fill: rgba(235, 235, 245, 0.12);
    --hairline: rgba(235, 235, 245, 0.14);
    --ink: rgba(255, 255, 255, 0.92);
    --ink-2: rgba(235, 235, 245, 0.66);
    --ink-3: rgba(235, 235, 245, 0.42);
    --select: #0a84ff;
  }
}

.board-search {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--hairline);
}

.board-search svg {
  flex: none;
  width: 20px;
  height: 20px;
  color: var(--ink-3);
}

.board-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 20px;
  font-weight: 300;
}

.board-search input::placeholder {
  color: var(--ink-3);
}

.board-body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
}

.board-list {
  overflow-y: auto;
  padding: 8px;
  border-right: 1px solid var(--hairline);
}

.board-list::-webkit-scrollbar {
  width: 8px;
}

.board-list::-webkit-scrollbar-thumb {
  border-radius: 4px;
  background: var(--fill);
}

.board-section {
  padding: 6px 10px 4px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 600;
}

.board-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 10px;
  border-radius: 8px;
}

.board-kind {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--fill);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 600;
  line-height: 22px;
  text-align: center;
}

.board-item .board-line {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.board-item kbd {
  flex: none;
  color: var(--ink-3);
  font: inherit;
  font-size: 11px;
}

.board-item.active {
  background: var(--select);
  color: #fff;
}

.board-item.active kbd {
  color: rgba(255, 255, 255, 0.8);
}

.board-item.active .board-kind {
  background: rgba(255, 255, 255, 0.22);
  color: #fff;
}

.board-preview {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 14px 18px 10px;
}

.board-full {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
  user-select: text;
  -webkit-user-select: text;
}

.board-meta {
  padding-top: 8px;
  color: var(--ink-3);
  font-size: 11px;
}

.board-empty {
  grid-column: 1 / -1;
  align-self: center;
  color: var(--ink-3);
  text-align: center;
}

.board-foot {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
  padding: 6px 10px;
  border-top: 1px solid var(--hairline);
}

.board-foot button {
  padding: 3px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-2);
  cursor: default;
  font: inherit;
  font-size: 11px;
}

.board-foot button:hover {
  background: var(--fill);
}

.board-foot button:first-child {
  margin-right: auto;
}

.board-foot kbd {
  margin-left: 4px;
  color: var(--ink-3);
  font: inherit;
}


  /* Preview only: a wallpaper stands in for the desktop, and CSS blur for the blur macOS applies behind the window. */
  html, body { margin: 0; height: auto; overflow: auto; background: #111; }
  .desk { position: relative; padding: 56px 0 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .desk.light { background:
    radial-gradient(60% 80% at 15% 20%, #ffb36b 0, transparent 60%),
    radial-gradient(50% 70% at 85% 15%, #6bc7ff 0, transparent 60%),
    radial-gradient(60% 80% at 70% 90%, #ff7eb6 0, transparent 60%),
    radial-gradient(60% 80% at 20% 90%, #8f7bff 0, transparent 60%), #e9eef5; }
  .desk.dark { background:
    radial-gradient(60% 80% at 15% 20%, #7a3cff 0, transparent 60%),
    radial-gradient(50% 70% at 85% 15%, #0a6cff 0, transparent 60%),
    radial-gradient(60% 80% at 70% 90%, #ff3d77 0, transparent 60%),
    radial-gradient(60% 80% at 20% 90%, #00b3a4 0, transparent 60%), #0c0f1a; }
  .label { font: 500 13px -apple-system, "Segoe UI", sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .desk .board { width: 680px; height: 430px; -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); box-shadow: 0 24px 60px rgba(0,0,0,.35); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif; }
  .desk.light .board { --tint: rgba(255,255,255,.36); --edge: rgba(255,255,255,.7); --fill: rgba(60,60,67,.1); --hairline: rgba(60,60,67,.18); --ink: rgba(0,0,0,.88); --ink-2: rgba(60,60,67,.72); --ink-3: rgba(60,60,67,.5); --select: #0a6cff; }
  .desk.dark .board { --tint: rgba(28,28,32,.38); --edge: rgba(255,255,255,.18); --fill: rgba(235,235,245,.12); --hairline: rgba(235,235,245,.14); --ink: rgba(255,255,255,.92); --ink-2: rgba(235,235,245,.66); --ink-3: rgba(235,235,245,.42); --select: #0a84ff; }
</style>
</head>
<body>
<template id="board">
  <div class="board">
    <div class="board-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input placeholder="Tìm trong clipboard">
    </div>
    <div class="board-body">
      <div class="board-list">
        <div class="board-section">Gần đây</div>
        <div class="board-item active"><span class="board-kind">Aa</span><span class="board-line">The meeting was moved to Thursday. Please send me the report</span><kbd>⌘1</kbd></div>
        <div class="board-item"><span class="board-kind">↗</span><span class="board-line">https://github.com/thydynh03/swipelate</span><kbd>⌘2</kbd></div>
        <div class="board-item"><span class="board-kind">&lt;&gt;</span><span class="board-line">pnpm tauri build --debug</span><kbd>⌘3</kbd></div>
        <div class="board-item"><span class="board-kind">Aa</span><span class="board-line">Cảm ơn bạn đã phản hồi, mình sẽ kiểm tra lại</span><kbd>⌘4</kbd></div>
        <div class="board-section">Đã ghim</div>
        <div class="board-item"><span class="board-kind">Aa</span><span class="board-line">Số 12 Nguyễn Văn Linh, Đà Nẵng</span><kbd>⌘5</kbd></div>
      </div>
      <div class="board-preview">
        <div class="board-full">The meeting was moved to Thursday. Please send me the report before you leave.</div>
        <div class="board-meta">safari · 2 phút trước · 78 ký tự</div>
      </div>
    </div>
    <div class="board-foot">
      <button>Xoá hết</button>
      <button>Dán<kbd>↵</kbd></button>
      <button>Dịch<kbd>⌘T</kbd></button>
      <button>Ghim<kbd>⌘P</kbd></button>
      <button>Xoá<kbd>⌘⌫</kbd></button>
    </div>
  </div>
</template>
<div class="desk light"><span class="label">macOS, chế độ sáng</span></div>
<div class="desk dark"><span class="label">macOS, chế độ tối</span></div>
<script>
  for (const desk of document.querySelectorAll(".desk")) desk.append(document.getElementById("board").content.cloneNode(true));
</script>
</body>
</html>
