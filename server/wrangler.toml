name = "quick-translate-stats"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "quick-translate-stats"
# Thay bằng id in ra từ `wrangler d1 create quick-translate-stats`.
database_id = "87374570-04a7-4637-89c7-80f5255c3014"

# Mỗi địa chỉ mạng gọi /ping tối đa 10 lần mỗi phút.
[[ratelimits]]
name = "PING_LIMITER"
# Số nguyên bất kỳ, miễn là không trùng với limiter khác trong cùng tài khoản Cloudflare.
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
