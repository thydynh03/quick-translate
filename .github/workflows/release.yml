name: release

# Builds the installers and publishes them as a GitHub release.
# Asset names are fixed so the website can link to releases/latest/download/<name>.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            source: src-tauri/target/release/bundle/nsis/*.exe
            asset: Swipelate-Setup-x64.exe
          - os: macos-latest
            args: --bundles dmg --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            source: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            asset: Swipelate-macOS-AppleSilicon.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
        env:
          QT_STATS_URL: ${{ vars.QT_STATS_URL }}
      - name: Rename installer
        shell: bash
        run: |
          mkdir out
          cp ${{ matrix.source }} "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
      # The Store package, for uploading to Partner Center by hand. Not on the release:
      # it is unsigned until the Store signs it. Runs once the identity is in the repo variables.
      - name: Pack for the Microsoft Store
        if: ${{ runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        run: >
          scripts/make-msix.ps1 -Version "$env:TAG" -Out out-store/Swipelate-Store-x64.msix
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"
      - if: ${{ runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: out-store/Swipelate-Store-x64.msix
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Swipelate-*
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ env.TAG }}
      - name: Pack the browser extension
        working-directory: src/extension
        run: |
          zip -r ../../out/Swipelate-YouTube-extension.zip . -x README.md
          # The name it had before the rename, for links already shared.
          cp ../../out/Swipelate-YouTube-extension.zip ../../out/QuickTranslate-YouTube-extension.zip
      - name: Copies named after the version
        # The plain names stay: the website's "latest" links and the app's updater ask for them.
        working-directory: out
        run: |
          for file in Swipelate-Setup-x64.exe Swipelate-macOS-AppleSilicon.dmg; do
            if [ -f "$file" ]; then
              cp "$file" "Swipelate-${TAG#v}-${file#Swipelate-}"
              # Versions up to 0.1.21, from when the app was Quick Translate, update from these names.
              cp "$file" "QuickTranslate-${file#Swipelate-}"
            fi
          done
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Swipelate ${TAG#v}" --generate-notes
          fi
