name: build

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change to the website or the documents alone needs no desktop build.
  # It is decided here and not by a path filter on the trigger, so that the
  # check the main branch requires ("ci") reports on every pull request.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.files.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          desktop=true
          if [ -n "$BASE" ]; then
            # On its own line: a diff that fails must fail the job, not pass for "nothing changed".
            files=$(git diff --name-only "$BASE...HEAD")
            if ! grep -qvE '^(website/|docs/|[^/]*\.md$)' <<< "$files"; then
              desktop=false
            fi
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test
        working-directory: src-tauri

  # The one check required before a merge: green when the tests passed or were not needed.
  ci:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST"
          [ "$CHANGES" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }
